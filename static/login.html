<!DOCTYPE html>
<html lang="en" class="bg-zinc-950 text-zinc-100 antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - LinkShortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="w-full max-w-sm p-6 sm:p-8 bg-zinc-900 border border-zinc-800">
        <div class="text-center mb-6">
            <a href="/" class="inline-flex items-center gap-2 text-emerald-500 font-bold mb-4">
                <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                <span>LinkShortener</span>
            </a>
            <h1 id="authTitle" class="text-xl font-bold tracking-tight text-zinc-100">Sign In</h1>
        </div>

        <div class="flex border-b border-zinc-800 mb-6">
            <button type="button" id="showLoginBtn" class="flex-1 py-2 text-sm font-medium text-emerald-500 border-b-2 border-emerald-500 cursor-pointer">Sign In</button>
            <button type="button" id="showRegBtn" class="flex-1 py-2 text-sm font-medium text-zinc-400 hover:text-zinc-200 border-b-2 border-transparent cursor-pointer">Create Account</button>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label for="loginUsername" class="block mb-1 text-xs font-medium uppercase tracking-wider text-zinc-400">Username</label>
                <input type="text" id="loginUsername" placeholder="e.g. user123" required autocomplete="username" class="w-full px-3.5 py-2.5 bg-zinc-950 border border-zinc-800 text-zinc-100 text-sm focus:outline-none focus:border-emerald-500 transition placeholder-zinc-500">
            </div>
            <div>
                <label for="loginPassword" class="block mb-1 text-xs font-medium uppercase tracking-wider text-zinc-400">Password</label>
                <div class="relative flex items-center w-full">
                    <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password" class="w-full px-3.5 py-2.5 pr-10 bg-zinc-950 border border-zinc-800 text-zinc-100 text-sm focus:outline-none focus:border-emerald-500 transition placeholder-zinc-500">
                    <button type="button" class="toggle-password-btn absolute right-3 text-zinc-400 hover:text-emerald-500 p-1" data-target="loginPassword" aria-label="Toggle password visibility">
                        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full py-2.5 text-sm font-medium text-black bg-emerald-500 hover:bg-emerald-600 transition cursor-pointer">Sign In</button>
        </form>

        <form id="registerForm" class="space-y-4 hidden">
            <div>
                <label for="regUsername" class="block mb-1 text-xs font-medium uppercase tracking-wider text-zinc-400">Username</label>
                <input type="text" id="regUsername" placeholder="3-50 characters" required autocomplete="username" class="w-full px-3.5 py-2.5 bg-zinc-950 border border-zinc-800 text-zinc-100 text-sm focus:outline-none focus:border-emerald-500 transition placeholder-zinc-500">
            </div>
            <div>
                <label for="regPassword" class="block mb-1 text-xs font-medium uppercase tracking-wider text-zinc-400">Password</label>
                <div class="relative flex items-center w-full">
                    <input type="password" id="regPassword" placeholder="At least 8 characters" required autocomplete="new-password" class="w-full px-3.5 py-2.5 pr-10 bg-zinc-950 border border-zinc-800 text-zinc-100 text-sm focus:outline-none focus:border-emerald-500 transition placeholder-zinc-500">
                    <button type="button" class="toggle-password-btn absolute right-3 text-zinc-400 hover:text-emerald-500 p-1" data-target="regPassword" aria-label="Toggle password visibility">
                        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full py-2.5 text-sm font-medium text-black bg-emerald-500 hover:bg-emerald-600 transition cursor-pointer">Create Account</button>
        </form>

        <div id="authAlert" class="p-3 mt-4 text-xs text-red-300 bg-red-950/40 border border-red-800 hidden"></div>
        <a href="/" class="block text-center mt-6 text-xs text-zinc-400 hover:text-zinc-200">← Back to Dashboard</a>
    </div>

    <script src="login.js"></script>
</body>
</html>
