<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Sign In & Registration - LinkShortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-body">
    <div class="auth-page-container">
        <header class="auth-header">
            <a href="/" class="brand-link">
                <div class="brand-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg>
                </div>
                <span class="brand-name">LinkShortener</span>
            </a>
            <a href="/" class="btn back-home-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Back to Home
            </a>
        </header>

        <main class="auth-card-wrapper">
            <div class="glass-card auth-standalone-card">
                <div class="auth-card-header">
                    <div class="auth-icon-badge">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                    <h1 id="authPageTitle">Welcome Back</h1>
                    <p id="authPageSubtitle" class="auth-subtitle">Sign in to manage your custom links & track analytics</p>
                </div>

                <div class="auth-nav-tabs">
                    <button id="authPageLoginTab" class="auth-tab-btn active">Sign In</button>
                    <button id="authPageRegisterTab" class="auth-tab-btn">Create Account</button>
                </div>

                <!-- Login Form -->
                <form id="standaloneLoginForm" class="auth-form">
                    <div class="form-group">
                        <label for="pageLoginUsername">Username</label>
                        <div class="input-with-icon">
                            <input type="text" id="pageLoginUsername" placeholder="Enter your username" required autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="pageLoginPassword">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="pageLoginPassword" placeholder="••••••••" required autocomplete="current-password">
                            <button type="button" class="toggle-password-btn" data-target="pageLoginPassword" aria-label="Toggle password visibility">
                                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="loginSubmitBtn" class="btn primary-btn btn-lg full-width">
                        <span>Sign In</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </form>

                <!-- Register Form -->
                <form id="standaloneRegisterForm" class="auth-form hidden">
                    <div class="form-group">
                        <label for="pageRegUsername">Username</label>
                        <div class="input-with-icon">
                            <input type="text" id="pageRegUsername" placeholder="3-50 alphanumeric characters" required autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="pageRegPassword">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="pageRegPassword" placeholder="At least 8 characters" required autocomplete="new-password">
                            <button type="button" class="toggle-password-btn" data-target="pageRegPassword" aria-label="Toggle password visibility">
                                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="registerSubmitBtn" class="btn primary-btn btn-lg full-width">
                        <span>Create Account</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </form>

                <div id="pageAuthAlert" class="alert hidden"></div>
            </div>

            <div class="auth-features">
                <div class="feature-pill"><span class="pill-dot"></span> Instant RAM Caching</div>
                <div class="feature-pill"><span class="pill-dot"></span> SHA-256 IP Anonymization</div>
                <div class="feature-pill"><span class="pill-dot"></span> Custom Alias Recycling</div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
