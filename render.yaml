services:
  - type: web
    name: url-shortener-service
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python wsgi.py
    envVars:
      - key: USE_POSTGRES
        value: "true"
      - key: POSTGRES_HOST
        fromDatabase:
          name: url-shortener-db
          property: host
      - key: POSTGRES_USER
        fromDatabase:
          name: url-shortener-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: url-shortener-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: url-shortener-db
          property: database
      - key: REDIS_HOST
        value: "epic-gorilla-185314.upstash.io"
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        value: "gQAAAAAAAtPiAAIgcDI3ZGMzOTcwNjZkZjI0OTA2YTVmNzY2NmE2ZDg1YzJiYQ"


databases:
  - name: url-shortener-db
    databaseName: url_shortener_db
    user: url_shortener_user
    plan: free



