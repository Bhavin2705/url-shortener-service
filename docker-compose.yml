version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - USE_POSTGRES=true
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=url_shortener_db
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - SECRET_KEY=change-me-generate-a-random-64-char-hex-string
      - IP_HASH_SECRET=change-me-generate-a-random-64-char-hex-string
      - ALLOWED_HOSTS=localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    depends_on:
      - db
      - cache

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=url_shortener_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
